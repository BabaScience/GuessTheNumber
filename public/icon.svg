<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Higher / Lower">
  <rect width="64" height="64" rx="15" fill="#fffcfd"/>
  <!-- the slash of the wordmark, standing in for the whole mark -->
  <path d="M39.5 15 24.5 49" stroke="#e4607f" stroke-width="5" stroke-linecap="round"/>
  <!-- up and down: the only two answers the game ever gives -->
  <path d="M19 27.5 24 22l5 5.5" fill="none" stroke="#2e1f2a" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M35 36.5 40 42l5-5.5" fill="none" stroke="#2e1f2a" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
